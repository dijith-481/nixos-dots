name: check

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Check update behavior
        run: python3 scripts/test-dots.py
      - name: Evaluate packages, system and cache compatibility
        # Evaluates every output and builds the `checks` output. --no-build cannot
        # be used here: stylix's base16Scheme is an IFD and a fresh runner has to
        # realise that derivation during evaluation.
        run: nix flake check --no-update-lock-file
